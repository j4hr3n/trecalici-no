name: Deploy GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate and check SEO files
        run: python3 scripts/build-seo.py --check && python3 scripts/check-site.py

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Project Pages lives at /trecalici-no/, while local preview uses /.
      # Change only the upload copy; keep the source portable for future hosting.
      - name: Prepare static files for the Pages URL
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/prepare-preview.py

      - name: Upload site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
