name: Deploy GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Project Pages lives at /trecalici-no/, while local preview uses /.
      # Change only the upload copy; keep the source portable for future hosting.
      - name: Prepare static files for the Pages URL
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          target = Path('_pages')
          shutil.copytree('site', target)
          prefix = os.environ['PAGES_BASE_PATH'].rstrip('/')
          for page in target.rglob('*.html'):
              source = page.read_text(encoding='utf-8')
              source = re.sub(r'((?:href|src)=[\'"])/(?!/)',
                              lambda match: match[1] + prefix + '/', source)
              page.write_text(source, encoding='utf-8')
          PY

      - name: Upload site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
